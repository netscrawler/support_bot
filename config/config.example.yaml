# Настройки логгирования
log:
    # Профиль логирования (debug - уровень DEBUG|prod - Уровень INFO|test - Уровень DEBUG + add source)
    level: prod
    # Путь к файлу куда писать логи(работает только если в output есть file)
    file: ./log.log
    # Вывод логов: (stdout|stdin|stderr|file) поддерживает несколько
    output:
        - stdout
    # Формат в котором пишутся логи: (json|text)
    format: text
    # Список стандартных полей для исключения (time, level, msg, source)
    exclude:
        - time
# Адрес Metabase для забора данных
metabase_domain: https://metabase.domain
appmetrica:
    o_auth_token: auth token for appmetrica
    Timeout: 5m0s
jira:
    auth_token: auth token from jira
    jira_host: https://your-jira-instance.atlassian.net
    timeout: 5m0s
# Прямые подключения к Postgres (коллектор типа pg). Ключ — имя базы, указывается в card_uuid запроса.
# DSN — только read-only пользователь с минимальными правами: dblink и подобные функции обходят read-only транзакцию.
databases:
    analytics:
        dsn: postgres://ro_user:password@host:5432/db
        read_only: true
        statement_timeout: 30s
        max_conns: 4
# Подключения к Grafana: чтение Prometheus через proxy datasource и коллектор алертов grafana_alerts.
# Ключ — имя, на него ссылается grafana в секции prometheus и card_uuid запроса grafana_alerts.
# Токен — service account Grafana с минимальными правами (роль Viewer: чтение правил и аннотаций).
# grafana_alerts: query = режим active | rules | history; params-фильтры:
#   active/rules — folder, group, state, alertname;
#   history — from, to (RFC3339 или epoch ms), limit (по умолчанию 10000), alertname.
# state — точное значение из Grafana: у правил inactive/pending/firing,
#   у экземпляров Alerting/Pending/Normal/"Alerting (NoData)" и т.п.
grafana:
    ops:
        url: https://grafana.example
        token: glsa_xxx
        timeout: 30s
# Источники Prometheus (коллектор типа prom). Ключ — имя источника, указывается в card_uuid запроса.
# Токены — с минимальными правами. Переменные Grafana ($__rate_interval, ${__range}) не поддерживаются:
# передавайте значения явными params и подставляйте через ${name}.
prometheus:
    # Запись напрямую
    main:
        url: https://prom.example
        bearer_token: xxx # либо basic_auth: {user: u, password: p}; одновременно нельзя
        timeout: 30s
    # Запись через Grafana
    main_via_grafana:
        grafana: ops
        datasource_uid: P1809F7CD0C75ACF3
# Источники Zabbix (коллектор типа zabbix). Ключ — имя источника, указывается в card_uuid запроса.
# url — корень фронтенда Zabbix, бот сам дописывает /api_jsonrpc.php. timeout по умолчанию 30s.
# Права: отдельный пользователь Zabbix, роль с «Access to API» -> allow list `*.get`,
# группа пользователей с read-only правами на нужные группы хостов. Бот сам тоже пропускает только методы `*.get`.
# Запрос: q_type = 'zabbix', card_uuid = имя источника (prod), query = JSON {"method": "<сервис>.get", "params": {...}}.
# params запроса — значения для ${name}; подстановка только внутри строковых значений JSON
# (числа передавайте строкой: "limit": "${n}").
# Пример problem.get (params: {"group": "15"}):
#   {"method":"problem.get","params":{"groupids":["${group}"],"severities":[4,5],"selectHosts":["host"],"selectTags":"extend"}}
# Пример history.get:
#   {"method":"history.get","params":{"itemids":["${item}"],"history":0,"time_from":"${from}","sortfield":"clock","sortorder":"DESC","limit":1000}}
#   Без limit/time_from ответ может быть огромным: бот лимит не подставляет.
# Результат: строка на элемент result, вложенное разворачивается в колонки (hosts.0.host, tags.0.value);
# countOutput -> одна строка {result: "42"}; значения как есть: severity кодом 0-5, clock — epoch секунды.
# Из Lua: collector.zabbix.collect("prod", [[{"method":"host.get","params":{"countOutput":true}}]], {})
#   возвращает rows, nil или nil, err.
zabbix:
    prod:
        url: https://zabbix.example.com
        token: <api-token>
        timeout: 30s
# Настройки Lua-процессора.
lua:
    # Таймаут для выполнения плагина.
    execution_timeout: 5m0s
    # Лимит памяти для 1 плагина в MB
    max_memory_mb: 256
    # Разрешенные луа модули
    allowed_modules:
        - json
        - http
        - url
        - time
        - strings
        - inspect
# Настройки подключения к Postgres
database:
    # Порт для подключения к базе
    port: 5432
    # Адрес базы данных
    host: localhost
    user: postgres
    # Пароль для подключения
    password: postgres
    # Имя базы данных
    name: database_name
    # SSL режим: (disable|require|verify-ca|verify-full|allow|prefer)
    sslmode: disable
    # Максимально количество соединений
    max_conns: 10
    # Максимальное количество ожидающий соединений
    max_idle_conns: 5
    # Максимальное время жизни одного соединения
    max_conn_life_time: 30m0s
    # Максимальное время ожидания соединения
    max_conn_idle_time: 2m0s
    # Таймаут на подключения к базе данных
    database_connect: 30s
# Настройки Telegram-бота.
# Используется для приема команд и отправки уведомлений.
telegram:
    # Телеграмм токен бота полученый от @BotFather
    # Обязателен для запуска бота.
    telegram_token: telegram_bot_token
    # CleanUpTime — интервал очистки временных данных бота
    # (кэш, состояния диалогов, временные сообщения и т.п.).
    clean_up_time: 10m0s
    # BotPoll — интервал long-polling запросов к Telegram API.
    bot_poll: 30s
    proxy: ""
    api_proxy: ""
# Настройка таймаутов
timeout:
    # Shutdown — максимальное время на корректное завершение приложения.
    # За это время должны завершиться все активные операции.
    # Если указать слишком маленький период не все процеесы могут завершится корректно
    shutdown: 10s
# Настройки подключения к SMB (Samba) файловой шаре.
# Используется для чтения и/или записи файлов на сетевой ресурс.
# Поддерживается аутентификация по логину/паролю.
smb:
    # Адрес SMB-сервера в формате: host:port
    # Пример:192.168.1.10:445
    address: localhost:542
    # Имя пользователя для аутентификации на SMB-сервере.
    user: user
    # Пароль пользователя для подключения к SMB-серверу.
    password: password
    # Домен Windows / рабочая группа.
    # Обычно: WORKGROUP.
    # Может быть пустым, если домен не используется.
    domain: WORKGROUP
    # Share — имя сетевой SMB-шары
    share: public
    # Active — включает использование SMB.
    # Если false, подключение к SMB не выполняется
    active: true
# Настройки SMTP-сервера.
# Используется для отправки email-уведомлений и отчетов.
# Поддерживается аутентификация по логину и паролю.
smtp:
    # Хост SMTP-сервера.
    # Примеры:
    #  smtp.gmail.com
    #  smtp.yandex.ru
    host: smtp.example.com
    # Порт SMTP-сервера.
    # Часто используемые:
    #  465 — SMTPS (SSL)
    #  587 — STARTTLS
    port: "465"
    # Email-адрес учетной записи,
    # от имени которой будут отправляться письма.
    # Этот адрес используется в поле From.
    email: example@example.com
    # Пароль от email-учетной записи.
    # Обычно это пароль приложения, а не основной пароль аккаунта.
    password: password
# Настройка Max бота
max:
    # Телеграмм токен бота полученный на платформе.
    max_token: max_bot_token
    # CleanUpTime — интервал очистки временных данных бота
    # (кэш, состояния диалогов, временные сообщения и т.п.).
    clean_up_time: 0s
    # BotPoll — интервал long-polling запросов к Max API.
    bot_poll: 0s
    api_proxy: ""
    # Флаг активации бота, false по умолчанию. Отвечает за то включать бота или нет
    max_enabled: false
# Настройки публичного HTTP API.
http:
    # HTTP server host
    host: 127.0.0.1
    # HTTP server port
    port: 8080
    # HTTP server read timeout
    read_timeout: 5s
    # HTTP server read header timeout
    read_header_timeout: 5s
    # HTTP server write timeout
    write_timeout: 6m0s
    # HTTP server idle timeout
    idle_timeout: 2m0s
    # HTTP server max header bytes
    max_header_bytes: 1048576
    # HTTP server max header value count
    max_header_value_count: 0
    # HTTP server max body bytes
    max_body_bytes: 10485760
# Уведомления администраторов о сбоях отчётов.
alerts:
    # Чат для уведомлений о сбоях отчётов (ID группы, например -100...). 0 — всем админам в личку.
    chat_id: 0
    # Тема (thread) в этом чате, необязательно.
    thread_id: 0
# Журнал запусков отчётов.
runs:
    # Сколько хранить журнал запусков отчётов.
    retention: 720h
