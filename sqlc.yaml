version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "migrations/init.sql/001_create_tables.sql"
      - "migrations/init.sql/002_create_report_tables.sql"
      - "migrations/init.sql/005_create_public_reports.sql"
      - "migrations/init.sql/006_add_query_text.sql"
      - "migrations/init.sql/007_create_report_runs.sql"
      - "migrations/init.sql/008_public_report_links_ttl.sql"
      - "migrations/init.sql/009_report_dedup.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: false
        emit_pointers_for_null_types: true
