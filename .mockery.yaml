all: true
dir: "{{.InterfaceDir}}/mock"
filename: mocks.go
force-file-write: true
formatter: goimports
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}_mock"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  support_bot/internal/collector:
    config:
      all: true
  support_bot/internal/service:
    config:
      all: false
    interfaces:
      ReportStore:
  support_bot/internal/orchestrator:
    config:
      all: false
    interfaces:
      ReportLoader:
  support_bot/internal/tg_bot/service:
    config:
      all: false
    interfaces:
      ReportProvider:
      ChatProvider:
      UserProvider:
      AdminNotifier:
